name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir -p android-project
          unzip -o "student-data-app.zip" -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-project/student-data-app
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project/student-data-app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-data-app-apk
          path: "android-project/student-data-app/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
